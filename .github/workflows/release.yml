# Publishes geo-shield-mcp to npm and the official MCP Registry when a
# GitHub Release is published. Authentication is OIDC only: npm trusted
# publishing (no NPM_TOKEN) and `mcp-publisher login github-oidc`.
# One-time npm setup is described in the README under "Releasing".
name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # npm trusted publishing + MCP Registry OIDC login
      contents: read
    env:
      PACKAGE_NAME: geo-shield-mcp
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # no caching in release builds

      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          # Trusted publishing needs npm >= 11.5.1.
          if [ "$(printf '%s\n' "11.5.1" "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version is too old for trusted publishing (needs >= 11.5.1)"
            exit 1
          fi

      - name: Verify release tag matches package.json version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version 'v$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Lets a failed MCP Registry step be re-run without failing here.
          if [ -n "$(npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "$PACKAGE_NAME@$VERSION is already on npm, skipping npm publish"
            exit 0
          fi
          tag_args=()
          case "$VERSION" in
            *-*) tag_args=(--tag next) ;; # prerelease versions must not become "latest"
          esac
          npm publish --provenance --access public "${tag_args[@]}"

      - name: Wait for npm to serve the new version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The MCP Registry rejects a version npm has not finished processing
          # (0.1.0 took about 3 minutes), so wait until the version document,
          # including mcpName, is served.
          url="https://registry.npmjs.org/$PACKAGE_NAME/$VERSION"
          for attempt in $(seq 1 40); do
            if mcp_name="$(curl --fail --silent --show-error "$url" | jq -er '.mcpName')"; then
              echo "npm serves $PACKAGE_NAME@$VERSION (mcpName=$mcp_name)"
              exit 0
            fi
            echo "Attempt $attempt: $PACKAGE_NAME@$VERSION not visible yet, retrying in 15s"
            sleep 15
          done
          echo "::error::$PACKAGE_NAME@$VERSION was not visible on npm after 10 minutes"
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher --version

      - name: Log in to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          server_name="$(jq -er '.name' server.json)"
          version_url="https://registry.modelcontextprotocol.io/v0.1/servers/${server_name//\//%2F}/versions/$VERSION"
          if curl --fail --silent --output /dev/null "$version_url"; then
            echo "$server_name $VERSION is already in the MCP Registry, nothing to do"
            exit 0
          fi
          # npm's CDN can still lag for the registry's own lookup, so retry.
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 60s"
            sleep 60
          done
          echo "::error::mcp-publisher publish failed after 5 attempts"
          exit 1
